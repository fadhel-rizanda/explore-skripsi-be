version: '3.8'

x-base-env: &base-env
  DB_CONNECTION: pgsql
  DB_HOST: db_dev
  DB_PORT: 5432
  DB_DATABASE: explore_skripsi_dev
  DB_USERNAME: postgres
  DB_PASSWORD: yourpassword
  REDIS_HOST: redis_dev
  REDIS_PORT: 6379

services:
  app_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: skripsi-be-app-dev
    container_name: laravel_frankenphp_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./storage:/app/storage
    ports:
      - "8000:80"
      - "8443:443"
    environment:
      <<: *base-env
      SERVER_NAME: :80
      REVERB_HOST: reverb_dev
      REVERB_PORT: 8080
      OCTANE_SERVER: frankenphp
      FRANKENPHP_CONFIG: worker ./public/index.php
      NUM_THREADS: 2
    depends_on:
      db_dev:
        condition: service_healthy
      redis_dev:
        condition: service_healthy
    networks:
      - laravel_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    command: sh -c "if [ ! -f .env ]; then cp .env.dev .env && php artisan key:generate && php artisan jwt:secret; fi && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019"

  db_dev:
    image: postgres:15-alpine
    container_name: postgres_db_dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=explore_skripsi_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - laravel_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_dev:
    image: redis:7-alpine
    container_name: redis_cache_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - laravel_dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  reverb_dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: skripsi-be-reverb-dev
    container_name: laravel_reverb_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./storage:/app/storage
    ports:
      - "8080:8080"
    environment:
      <<: *base-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      db_dev:
        condition: service_healthy
      redis_dev:
        condition: service_healthy
      app_dev:
        condition: service_healthy
    networks:
      - laravel_dev
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080 > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: sh -c "php artisan reverb:start --host=0.0.0.0 --port=8080 --debug"

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local

networks:
  laravel_dev:
    name: skripsi-be_laravel_dev
    driver: bridge
