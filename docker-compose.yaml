version: '3.8'

x-base-env: &base-env
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: explore_skripsi
  DB_USERNAME: postgres
  DB_PASSWORD: yourpassword
  REDIS_HOST:  redis
  REDIS_PORT:  6379

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_frankenphp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:80"
      - "8443:443"
    environment:
      <<: *base-env
      SERVER_NAME: :80
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      OCTANE_SERVER: frankenphp
      FRANKENPHP_CONFIG: worker ./public/index.php
      NUM_THREADS: 4
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    command: sh -c "if [ ! -f .env ]; then cp .env.docker .env && php artisan key:generate && php artisan jwt:secret; fi && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=80 --admin-port=2019"
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=explore_skripsi
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=yourpassword
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_reverb
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    environment:
      <<: *base-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - laravel
    command: sh -c "php artisan reverb:start --host=0.0.0.0 --port=8080"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_queue
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      <<: *base-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - laravel
    command: sh -c "php artisan queue:work --sleep=3 --tries=3 --max-time=3600"
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_scheduler
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      <<: *base-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition:  service_healthy
      app:
        condition: service_healthy
    networks:
      - laravel
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  laravel:
    driver: bridge
