version: '3.8'

x-base-env: &base-env
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: explore_skripsi
  DB_USERNAME: postgres
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}

# Shared build definition — queue, scheduler, reverb all reuse the app image
# so we only build once. Override `command` per service.
x-app-base: &app-base
  image: skripsi-be-app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  working_dir: /app
  volumes:
    - ./storage:/app/storage
  networks:
    - laravel

services:
  app:
    <<: *app-base
    container_name: laravel_frankenphp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./storage:/app/storage
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    environment:
      <<: *base-env
      SERVER_NAME: api.pawsitivehub.site, pawsitivehub.site
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      APP_FRONTEND_URL: https://pawsitivehub.site
      FRONTEND_URL: https://pawsitivehub.site
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    command: >
      sh -c "
        if [ ! -f .env ]; then
          cp .env.example .env &&
          php artisan key:generate &&
          php artisan jwt:secret;
        fi &&
        php artisan migrate --force &&
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan view:cache &&
        frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
      "

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: explore_skripsi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "100.85.54.93:5432:5432"
    networks:
      - laravel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "100.85.54.93:6379:6379"
    networks:
      - laravel
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  reverb:
    <<: *app-base
    container_name: laravel_reverb
    ports:
      - "8080:8080"
    environment:
      <<: *base-env
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_exists('/proc/1/status') ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: php artisan reverb:start --host=0.0.0.0 --port=8080

  queue:
    <<: *app-base
    container_name: laravel_queue
    environment:
      <<: *base-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_exists('/proc/1/status') ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  scheduler:
    <<: *app-base
    container_name: laravel_scheduler
    environment:
      <<: *base-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_exists('/proc/1/status') ? 0 : 1);\""]
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "100.85.54.93:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    networks:
      - laravel

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "100.85.54.93:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=http://100.85.54.93:3000
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - laravel
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    networks:
      - laravel
    pid: host

  postgres_exporter:
    image: wrouesnel/postgres_exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${DB_PASSWORD}@db:5432/explore_skripsi?sslmode=disable"
    networks:
      - laravel
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  laravel:
    name: skripsi-be_laravel
    driver: bridge

